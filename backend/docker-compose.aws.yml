name: moodify

services:
  redis:
    image: redis:7-alpine
    container_name: moodify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mood-detection:
    image: moodify-mood-detection:latest
    build:
      context: ./services/mood-detection
      dockerfile: Dockerfile
    container_name: moodify-mood-detection
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - MODEL_PATH=/app/models/mood_mobilenetv2.onnx
    volumes:
      - ./services/mood-detection/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    image: moodify-api-gateway:latest
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: moodify-api-gateway
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - FRONTEND_SUCCESS_URL=${FRONTEND_SUCCESS_URL}
      - MOOD_DETECTION_SERVICE_URL=http://mood-detection:8001
      - RECOMMENDATION_SERVICE_URL=http://recommendation-engine:3001
      - REDIS_URL=redis://redis:6379
      - MOOD_SMOOTHING_WINDOW_SIZE=${MOOD_SMOOTHING_WINDOW_SIZE:-3}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    depends_on:
      redis:
        condition: service_healthy
      mood-detection:
        condition: service_healthy
      recommendation-engine:
        condition: service_started

  recommendation-engine:
    image: moodify-recommendation-engine:latest
    build:
      context: ./services/recommendation-engine
      dockerfile: Dockerfile
    container_name: moodify-recommendation-engine
    ports:
      - "3011:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.4}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    depends_on: []

volumes:
  redis_data:
